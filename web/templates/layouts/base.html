{{define "base"}}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sportss Colombia: encuentra y reserva canchas deportivas por hora. Publica tu cancha y recibe reservas.">
  <meta name="theme-color" content="#0f766e">
  <title>{{.Title}} · {{.AppName}}</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="{{.BodyClass}}">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  {{template "nav" .}}
  {{if .Flash}}
  <div class="toast toast-{{.FlashType}}" data-dismissible role="status">
    <span>{{.Flash}}</span>
    <button type="button" class="toast-close" aria-label="Cerrar mensaje">&times;</button>
  </div>
  {{end}}
  <main id="contenido">
    {{template "content" .}}
  </main>
  {{template "footer" .}}
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
  <script src="/static/js/court.js" defer></script>
  <script src="/static/js/court-form.js" defer></script>
  <script src="/static/js/dashboard.js" defer></script>
  <script src="/static/js/account.js" defer></script>
</body>
</html>
{{end}}
